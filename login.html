<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ LTC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <header class="login-head">
        <div class="login-logo">🏥</div>
        <div>
          <h1>ระบบ LTC เทศบาลชำราก</h1>
          <p>เข้าสู่ระบบเพื่อใช้งานทุกหน้าอย่างปลอดภัย</p>
        </div>
      </header>

      <form id="loginForm" class="login-form" autocomplete="on">
        <label>
          ชื่อผู้ใช้
          <input id="usernameInput" name="username" type="text" autocomplete="username" required>
        </label>

        <label>
          รหัสผ่าน
          <div class="password-wrap">
            <input id="passwordInput" name="password" type="password" autocomplete="current-password" required>
            <button id="togglePasswordBtn" class="toggle-password" type="button">แสดง</button>
          </div>
        </label>

        <label class="remember-row">
          <input id="rememberPassword" type="checkbox">
          <span>จดจำการเข้าสู่ระบบบนเครื่องนี้</span>
        </label>

        <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>

        <button id="loginSubmitBtn" class="login-submit" type="submit">เข้าสู่ระบบ</button>
      </form>

      <footer class="login-foot">
        <small>ค่าเริ่มต้น: admin / admin123456 (เปลี่ยนได้ที่ ENV ฝั่ง backend)</small>
      </footer>
    </section>
  </main>

  <script src="/public/runtime-config.js"></script>
  <script type="module" src="/public/login.js"></script>
</body>
</html>
